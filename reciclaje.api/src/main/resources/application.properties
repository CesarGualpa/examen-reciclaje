spring.application.name=reciclaje-api

spring.datasource.url=jdbc:postgresql://localhost:5432/reciclaje_db

spring.datasource.username=${RECICLAJE_DB_USER}
spring.datasource.password=${RECICLAJE_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080